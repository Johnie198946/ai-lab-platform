name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: python -m pip install ruff
      - run: PYTHONPATH=. ruff check backend/ scripts/ tests/

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  build:
    needs: [lint, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p "$RUNNER_TEMP/ci-home/.hermes"
          printf 'HOME=%s\nHERMES_HOME=%s\n' \
            "$RUNNER_TEMP/ci-home" "$RUNNER_TEMP/ci-home/.hermes" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          ref: c8aa5608c24e3636e77c267650c0f1f52e44adb0
          path: .ci/hermes-agent
          persist-credentials: false
      - run: |
          test "$(git -C .ci/hermes-agent rev-parse HEAD)" = "c8aa5608c24e3636e77c267650c0f1f52e44adb0"
          ln -s "$GITHUB_WORKSPACE/.ci/hermes-agent" "$HERMES_HOME/hermes-agent"
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. python -m pytest -q
      - run: PYTHONPATH=. python -c "import backend; print('import ok')"
