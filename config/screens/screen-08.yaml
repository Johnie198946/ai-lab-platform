screen_id: "screen-08"
title: "五工位并行体验中心"
role: "parallel-experience"
layout: "isolated-workstation"
theme: "aurora-light"
data_bindings:
  - source: "/api/showroom/sessions/{session_id}"
    component: "independent-session"
    refresh: "write-through"
    isolation_key: "slot"
  - source: "/api/chat/stream"
    component: "independent-session"
    refresh: "sse"
    isolation_key: "slot"
auto_fullscreen: true
