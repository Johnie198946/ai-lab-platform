screen_id: "screen-04"
title: "需求深度洞察报告"
role: "insight-report"
layout: "markdown-report"
theme: "aurora-light"
data_bindings:
  - source: "/api/showroom/sessions/{session_id}"
    component: "insight-report"
    refresh: "session"
  - source: "/api/knowledge/search"
    component: "evidence-search"
    refresh: "on-demand"
  - source: "/api/ws"
    component: "insight-generation"
    refresh: "hermes-json-rpc"
  - source: "/api/showroom/sessions/{session_id}/insight/jobs"
    component: "incremental-sections"
    refresh: "websocket-events"
auto_fullscreen: true
