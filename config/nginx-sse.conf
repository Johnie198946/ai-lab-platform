# Nginx SSE 流式代理配置（Bridge v5）
# 用法：在主 nginx.conf 的 location /api/orchestration/sessions 块中 include 此文件
# 或直接在对应 location 中添加以下指令

# 禁用代理缓冲（SSE 必须·否则 nginx 会攒批推送·破坏流式体验）
proxy_buffering off;
proxy_cache off;

# 禁用请求/响应缓冲
proxy_request_buffering off;

# 长连接超时（SSE 流式可达数分钟）
proxy_read_timeout 600s;
proxy_send_timeout 600s;

# 禁用分块传输编码的缓冲
chunked_transfer_encoding on;

# 传递客户端断开信号给上游
proxy_ignore_client_abort off;

# SSE 必需的响应头（由上游 FastAPI 设置·此处确保透传）
# add_header X-Accel-Buffering no;
# add_header Cache-Control no-cache;
