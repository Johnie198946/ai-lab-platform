# AI Lab Platform — 生产部署编排
# 用法: docker compose up -d --build
# 配置: 复制 .env.example 为 .env 后按需修改

services:
  # PostgreSQL — 知识库主库（仅本机可连；Authen 认证服务复用）
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_lab}
      POSTGRES_USER: ${POSTGRES_USER:-ailab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ailab_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ailab} -d ${POSTGRES_DB:-ai_lab}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis — 会话 / 缓存（仅本机可连；Authen 认证服务复用）
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API — 后端服务
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ailab}:${POSTGRES_PASSWORD:-ailab_dev}@postgres:5432/${POSTGRES_DB:-ai_lab}
      REDIS_URL: redis://redis:6379
      # 问答 API 需要 deepseek（.env 注入）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Authen 统一认证（与认证服务共享的 HS256 密钥；配置后 API 强制 Bearer JWT）
      AUTHEN_JWT_SECRET: ${AUTHEN_JWT_SECRET:-}
      # Authen 认证服务（宿主机 systemd，经 host.docker.internal 访问）
      AUTHEN_BASE: http://host.docker.internal:8001
      AUTHEN_USER_URL: http://host.docker.internal:8003
      AUTHEN_PERMISSION_URL: http://host.docker.internal:8004
      # 知识库镜像挂载点（宿主机 ./data/vault 同步自本地 Obsidian 库）
      AI_LAB_HOME: /app/data/vault
      AI_LAB_WIKI: /app/data/vault/wiki
      AI_LAB_VAULT: /app/data/vault
    volumes:
      - ./data:/app/data
      # Hermes CLI 挂载（Supervision 批复意见 #1, #3）
      - /opt/hermes:/opt/hermes                    # Hermes 可执行+venv
      - /root/.hermes/skills:/root/.hermes/skills  # skills 目录可写
      - /root/.hermes/config.yaml:/root/.hermes/config.yaml:ro  # config 只读
      - /root/.hermes/profiles:/root/.hermes/profiles  # profiles 配置
      - /opt/ai-lab-platform:/opt/ai-lab-platform  # CWD 挂载（意见 #1）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api

volumes:
  pgdata:
