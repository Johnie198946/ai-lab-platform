# AI Lab Platform — 生产部署编排
# 本地构建: docker compose up -d --build；生产发布仅由 scripts/update.sh 使用预载镜像启动
# 配置: 复制 .env.example 为 .env 后按需修改

x-app-hardening: &app-hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  # PostgreSQL — 知识库主库（仅本机可连；Authen 认证服务复用）
  postgres:
    <<: *app-hardening
    image: ${AI_LAB_POSTGRES_IMAGE:-ai-lab-platform-postgres:offline}
    build:
      context: ./infrastructure/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_lab}
      POSTGRES_USER: ${POSTGRES_USER:-ailab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ailab_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,uid=70,gid=70,mode=0775
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ailab} -d ${POSTGRES_DB:-ai_lab}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis — 会话 / 缓存（仅本机可连；Authen 认证服务复用）
  redis:
    <<: *app-hardening
    image: ${AI_LAB_REDIS_IMAGE:-ai-lab-platform-redis:offline}
    build:
      context: ./infrastructure/redis
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ "$${#REDIS_PASSWORD}" -lt 32 ]; then
          echo "ERROR: REDIS_PASSWORD must be at least 32 characters" >&2
          exit 1
        fi
        case "$$REDIS_PASSWORD" in
          *[!A-Za-z0-9_-]*)
            echo "ERROR: REDIS_PASSWORD may contain only A-Z, a-z, 0-9, underscore, and hyphen" >&2
            exit 1
            ;;
        esac
        umask 077
        printf 'save ""\nappendonly no\ndir /tmp\nrequirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        chmod 600 /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
  # API — 后端服务
  api:
    <<: *app-hardening
    image: ${AI_LAB_API_IMAGE:-ai-lab-platform-api:offline}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        AI_LAB_RUNTIME_UID: ${AI_LAB_RUNTIME_UID:-10001}
        AI_LAB_RUNTIME_GID: ${AI_LAB_RUNTIME_GID:-10001}
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ailab}:${POSTGRES_PASSWORD:-ailab_dev}@postgres:5432/${POSTGRES_DB:-ai_lab}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # 问答 API 需要 deepseek（.env 注入）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Authen 统一认证（与认证服务共享的 HS256 密钥；配置后 API 强制 Bearer JWT）
      AUTHEN_JWT_SECRET: ${AUTHEN_JWT_SECRET:?Set a non-empty AUTHEN_JWT_SECRET in .env}
      AUTHEN_JWT_ISSUER: ${AUTHEN_JWT_ISSUER:?Set a non-empty AUTHEN_JWT_ISSUER in .env}
      AUTHEN_JWT_AUDIENCE: ${AUTHEN_JWT_AUDIENCE:?Set a non-empty AUTHEN_JWT_AUDIENCE in .env}
      AUTHEN_JWT_STRICT_PROVENANCE: ${AUTHEN_JWT_STRICT_PROVENANCE:?Set AUTHEN_JWT_STRICT_PROVENANCE=true in .env}
      AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:-}
      AUTH_WEB_RETURN_URL: ${AUTH_WEB_RETURN_URL:-}
      AUTH_IOS_RETURN_URL: ${AUTH_IOS_RETURN_URL:-quantum://oauth/callback}
      # 开发者免短信登录（默认关闭；启用时必须配置独立固定账号/验证码）
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}
      DEV_LOGIN_PHONE: ${DEV_LOGIN_PHONE:-}
      DEV_LOGIN_CODE: ${DEV_LOGIN_CODE:-}
      DEV_LOGIN_USER_ID: ${DEV_LOGIN_USER_ID:-dev-user}
      DEV_LOGIN_USERNAME: ${DEV_LOGIN_USERNAME:-开发者}
      DEV_LOGIN_ALLOWED_IP: ${DEV_LOGIN_ALLOWED_IP:-}
      DEV_LOGIN_EXPIRES_AT: ${DEV_LOGIN_EXPIRES_AT:-}
      # Authen 认证服务（宿主机 systemd，经 host.docker.internal 访问）
      AUTHEN_BASE: http://host.docker.internal:8001
      AUTHEN_USER_URL: http://host.docker.internal:8003
      AUTHEN_PERMISSION_URL: http://host.docker.internal:8004
      # 知识库镜像挂载点（宿主机 ./data/vault 同步自本地 Obsidian 库）
      AI_LAB_HOME: /app/data/vault
      AI_LAB_WIKI: /app/data/vault/wiki
      AI_LAB_VAULT: /app/data/vault
      LD_LIBRARY_PATH: /usr/lib64
      # 飞书通知(Agent 汇报通道 · 自定义机器人 webhook · 未配置则仅站内)
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      # Hermes 桥接(容器 → 宿主机 Hermes)
      # 注册与请求鉴权共用 auth.py 的碰撞安全租户映射；不接受环境变量覆盖用户边界
      HERMES_BRIDGE_URL: ${HERMES_BRIDGE_URL:-http://host.docker.internal:9118/v1/chat}
      HERMES_BRIDGE_INTERNAL_TOKEN: ${HERMES_BRIDGE_INTERNAL_TOKEN:?Set a non-empty HERMES_BRIDGE_INTERNAL_TOKEN in .env}
      AI_LAB_ENV: production
      AI_LAB_CORS_ORIGINS: ${AI_LAB_CORS_ORIGINS:-}
      TENANT_KNOWLEDGE_POLICY_V2: ${TENANT_KNOWLEDGE_POLICY_V2:-true}
      KNOWLEDGE_CAPABILITY_SECRET: ${KNOWLEDGE_CAPABILITY_SECRET:-}
      KNOWLEDGE_GATEWAY_PERF_OBSERVE: ${KNOWLEDGE_GATEWAY_PERF_OBSERVE:-false}
      AUTHEN_ENTITLEMENT_WEBHOOK_SECRET: ${AUTHEN_ENTITLEMENT_WEBHOOK_SECRET:-}
      AUTHEN_AI_PLATFORM_SERVICE_TOKEN: ${AUTHEN_AI_PLATFORM_SERVICE_TOKEN:-}
      AUTHEN_KNOWLEDGE_APPROVAL_SECRET: ${AUTHEN_KNOWLEDGE_APPROVAL_SECRET:-}
      AUTHEN_SUBSCRIPTION_URL: ${AUTHEN_SUBSCRIPTION_URL:-http://host.docker.internal:8006}
      AUTHEN_PERSONAL_PUBLIC_ORG_ID: ${AUTHEN_PERSONAL_PUBLIC_ORG_ID:-00000000-0000-0000-0000-000000000001}
      WORKFLOW_EXECUTION_V2: ${WORKFLOW_EXECUTION_V2:-true}
      WORKFLOW_HERMES_PLANNING: ${WORKFLOW_HERMES_PLANNING:-true}
      # Hermes Dashboard 会话 Token（Tab 1 官方 Web 容器认证通道 · B-2-2；
      # 部署时须与宿主机 hermes-serve 的 HERMES_DASHBOARD_SESSION_TOKEN 同值，否则 401）
      HERMES_SERVE_TOKEN: ${HERMES_SERVE_TOKEN:-}
      HOME: /home/ailab
    command:
      - /bin/sh
      - -c
      - |
        if [ "$${#AUTHEN_JWT_SECRET}" -lt 32 ]; then
          echo "ERROR: AUTHEN_JWT_SECRET must be at least 32 characters" >&2
          exit 1
        fi
        case "$$AUTHEN_JWT_ISSUER" in
          *[![:space:]]*) ;;
          *)
            echo "ERROR: AUTHEN_JWT_ISSUER must contain a non-whitespace character" >&2
            exit 1
            ;;
        esac
        case "$$AUTHEN_JWT_AUDIENCE" in
          *[![:space:]]*) ;;
          *)
            echo "ERROR: AUTHEN_JWT_AUDIENCE must contain a non-whitespace character" >&2
            exit 1
            ;;
        esac
        [ "$$AUTHEN_JWT_STRICT_PROVENANCE" = true ] || {
          echo "ERROR: AUTHEN_JWT_STRICT_PROVENANCE must be literal true" >&2
          exit 1
        }
        exec uvicorn backend.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
      - /opt/ai-lab-platform:/opt/ai-lab-platform:ro  # 代码真源只读；运行数据走 /app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 持久工作流执行器：独立消费 PostgreSQL 队列，API/客户端重启不丢任务
  workflow-worker:
    <<: *app-hardening
    image: ${AI_LAB_WORKFLOW_WORKER_IMAGE:-ai-lab-platform-workflow-worker:offline}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        AI_LAB_RUNTIME_UID: ${AI_LAB_RUNTIME_UID:-10001}
        AI_LAB_RUNTIME_GID: ${AI_LAB_RUNTIME_GID:-10001}
    command: ["python", "-m", "backend.workers.workflow_worker"]
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ailab}:${POSTGRES_PASSWORD:-ailab_dev}@postgres:5432/${POSTGRES_DB:-ai_lab}
      AI_LAB_HOME: /app/data/vault
      HERMES_BRIDGE_URL: ${HERMES_BRIDGE_URL:-http://host.docker.internal:9118/v1/chat}
      HERMES_BRIDGE_INTERNAL_TOKEN: ${HERMES_BRIDGE_INTERNAL_TOKEN:?Set a non-empty HERMES_BRIDGE_INTERNAL_TOKEN in .env}
      TENANT_KNOWLEDGE_POLICY_V2: ${TENANT_KNOWLEDGE_POLICY_V2:-true}
      KNOWLEDGE_CAPABILITY_SECRET: ${KNOWLEDGE_CAPABILITY_SECRET:-}
      AUTHEN_AI_PLATFORM_SERVICE_TOKEN: ${AUTHEN_AI_PLATFORM_SERVICE_TOKEN:-}
      AUTHEN_SUBSCRIPTION_URL: ${AUTHEN_SUBSCRIPTION_URL:-http://host.docker.internal:8006}
      WORKFLOW_EXECUTION_V2: ${WORKFLOW_EXECUTION_V2:-true}
      HOME: /home/ailab
    volumes:
      - ./data:/app/data
      - /opt/ai-lab-platform:/opt/ai-lab-platform:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; assert b'backend.workers.workflow_worker' in pathlib.Path('/proc/1/cmdline').read_bytes()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # 持久方案规划器：独立租约队列，API/客户端/Worker 重启后继续同一规划任务
  planning-worker:
    <<: *app-hardening
    image: ${AI_LAB_PLANNING_WORKER_IMAGE:-ai-lab-platform-planning-worker:offline}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        AI_LAB_RUNTIME_UID: ${AI_LAB_RUNTIME_UID:-10001}
        AI_LAB_RUNTIME_GID: ${AI_LAB_RUNTIME_GID:-10001}
    command: ["python", "-m", "backend.workers.workflow_planning_worker"]
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ailab}:${POSTGRES_PASSWORD:-ailab_dev}@postgres:5432/${POSTGRES_DB:-ai_lab}
      AI_LAB_HOME: /app/data/vault
      HERMES_BRIDGE_URL: ${HERMES_BRIDGE_URL:-http://host.docker.internal:9118/v1/chat}
      HERMES_BRIDGE_INTERNAL_TOKEN: ${HERMES_BRIDGE_INTERNAL_TOKEN:?Set a non-empty HERMES_BRIDGE_INTERNAL_TOKEN in .env}
      WORKFLOW_HERMES_PLANNING: ${WORKFLOW_HERMES_PLANNING:-true}
      TENANT_KNOWLEDGE_POLICY_V2: ${TENANT_KNOWLEDGE_POLICY_V2:-true}
      KNOWLEDGE_CAPABILITY_SECRET: ${KNOWLEDGE_CAPABILITY_SECRET:-}
      AUTHEN_AI_PLATFORM_SERVICE_TOKEN: ${AUTHEN_AI_PLATFORM_SERVICE_TOKEN:-}
      AUTHEN_SUBSCRIPTION_URL: ${AUTHEN_SUBSCRIPTION_URL:-http://host.docker.internal:8006}
      HOME: /home/ailab
    volumes:
      - ./data:/app/data
      - /opt/ai-lab-platform:/opt/ai-lab-platform:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; assert b'backend.workers.workflow_planning_worker' in pathlib.Path('/proc/1/cmdline').read_bytes()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # 持久 Agent 正式评估队列：独立租约，客户端或服务重启后可恢复
  agent-evaluation-worker:
    <<: *app-hardening
    image: ${AI_LAB_AGENT_EVALUATION_WORKER_IMAGE:-ai-lab-platform-agent-evaluation-worker:offline}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        AI_LAB_RUNTIME_UID: ${AI_LAB_RUNTIME_UID:-10001}
        AI_LAB_RUNTIME_GID: ${AI_LAB_RUNTIME_GID:-10001}
    command: ["python", "-m", "backend.workers.agent_evaluation_worker"]
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ailab}:${POSTGRES_PASSWORD:-ailab_dev}@postgres:5432/${POSTGRES_DB:-ai_lab}
      AI_LAB_HOME: /app/data/vault
      HERMES_BRIDGE_URL: ${HERMES_BRIDGE_URL:-http://host.docker.internal:9118/v1/chat}
      HERMES_BRIDGE_INTERNAL_TOKEN: ${HERMES_BRIDGE_INTERNAL_TOKEN:?Set a non-empty HERMES_BRIDGE_INTERNAL_TOKEN in .env}
      TENANT_KNOWLEDGE_POLICY_V2: ${TENANT_KNOWLEDGE_POLICY_V2:-true}
      KNOWLEDGE_CAPABILITY_SECRET: ${KNOWLEDGE_CAPABILITY_SECRET:-}
      AUTHEN_AI_PLATFORM_SERVICE_TOKEN: ${AUTHEN_AI_PLATFORM_SERVICE_TOKEN:-}
      AUTHEN_SUBSCRIPTION_URL: ${AUTHEN_SUBSCRIPTION_URL:-http://host.docker.internal:8006}
      HOME: /home/ailab
    volumes:
      - ./data:/app/data
      - /opt/ai-lab-platform:/opt/ai-lab-platform:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; assert b'backend.workers.agent_evaluation_worker' in pathlib.Path('/proc/1/cmdline').read_bytes()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # Dashi Taskboard — upstream UI and issue-management runtime.
  # AI execution remains owned by AI Lab and is entered through the QWS host bridge.
  taskboard:
    <<: *app-hardening
    image: ${AI_LAB_TASKBOARD_IMAGE:-ai-lab-platform-taskboard:offline}
    build:
      context: ./apps/dashi-taskboard
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=1000,gid=1000
    environment:
      CODEX_TASKBOARD_HOST: 0.0.0.0
      CODEX_TASKBOARD_PORT: 47823
      CODEX_TASKBOARD_DATA_DIR: /data
      CODEX_TASKBOARD_VERSION: qws-dashi-5c96d1a
      CODEX_TASKBOARD_QWS_MODE: "true"
      AI_LAB_INTERNAL_BASE_URL: http://api:8000
      HERMES_BRIDGE_INTERNAL_TOKEN: ${HERMES_BRIDGE_INTERNAL_TOKEN:?Set a non-empty HERMES_BRIDGE_INTERNAL_TOKEN in .env}
    volumes:
      - taskboard_data:/data
      - /opt/ai-lab-platform:/workspace:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:47823/api/meta').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # 前端服务
  frontend:
    <<: *app-hardening
    image: ${AI_LAB_FRONTEND_IMAGE:-ai-lab-platform-frontend:offline}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    user: "101:101"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=101,gid=101
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:9080:9080"
      - "127.0.0.1:9081:9081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - taskboard
    volumes:
      - ./docs/charts:/usr/share/nginx/html/charts:ro
      # TLS material must be supplied by the host; repository fallbacks are forbidden.
      - ${AI_LAB_TLS_CERT_FILE:?Set a non-empty AI_LAB_TLS_CERT_FILE to the host TLS certificate path}:/etc/nginx/ssl/ailab.crt:ro
      - ${AI_LAB_TLS_KEY_FILE:?Set a non-empty AI_LAB_TLS_KEY_FILE to the host TLS private key path}:/etc/nginx/ssl/ailab.key:ro

volumes:
  pgdata:
  taskboard_data:
