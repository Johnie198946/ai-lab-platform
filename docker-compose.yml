version: "3.8"

services:
  # PostgreSQL — 知识库主库
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_lab
      POSTGRES_USER: ailab
      POSTGRES_PASSWORD: ailab_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ailab -d ai_lab"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis — 会话 / 缓存
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # API — 后端服务（先占位·等代码写完接）
  api:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://ailab:ailab_dev@postgres:5432/ai_lab
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app
    command: ["echo", "API server placeholder — will start when backend is ready"]
    profiles:
      - full

volumes:
  pgdata:
