schema_version: "1.0"
process:
  id: xfusion.ipd
  version: 1.0.0
  domain: product-development
  name: 超聚变IPD产品开发流程
source:
  type: compiled_wiki_snapshot
  content_hashes:
    wiki/方法论/超聚变IPD产品开发流程.md: 34a9470fdf78e1fa9fbd472794bf7783c82c35cc578e8345212e790448076857
