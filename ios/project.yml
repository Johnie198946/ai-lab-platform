# AIPlatformApp - XcodeGen 工程配置
# 生成: xcodegen generate
name: AIPlatformApp
options:
  bundleIdPrefix: com.ailab
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.1"
  createIntermediateGroups: true

targets:
  AIPlatformApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - AIPlatformApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ailab.AIPlatformApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quantum
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "用于语音交互输入，将你的语音实时转写为文字。"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "用于将你的语音转写为文字，辅助对话输入。"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    scheme:
      testTargets: []
