# AIPlatformApp - XcodeGen 工程配置
# 生成: xcodegen generate
name: AIPlatformApp
options:
  bundleIdPrefix: com.ailab
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.1"
  createIntermediateGroups: true

targets:
  AIPlatformApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - AIPlatformApp
    info:
      path: AIPlatformApp/Info.plist
      properties:
        CFBundleDisplayName: Quantum
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleURLName: com.ailab.AIPlatformApp.oauth
            CFBundleURLSchemes:
              - quantum
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: "用于语音交互输入，将你的语音实时转写为文字。"
        NSSpeechRecognitionUsageDescription: "用于将你的语音转写为文字，辅助对话输入。"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        # ATS：内测直连云端明文 HTTP 必需（嵌套字典 INFOPLIST_KEY_ 无法表达，必须显式 Info.plist）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ailab.AIPlatformApp
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    scheme:
      testTargets: []
