# AIPlatformApp - XcodeGen 工程配置
# 生成: xcodegen generate
name: AIPlatformApp
options:
  bundleIdPrefix: com.ailab
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.1"
  createIntermediateGroups: true

targets:
  AIPlatformApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - AIPlatformApp
    info:
      path: AIPlatformApp/Info.plist
      properties:
        CFBundleDisplayName: Quantumn
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.ailab.AIPlatformApp.oauth
            CFBundleURLSchemes:
              - quantum
        LSApplicationQueriesSchemes:
          - alipays
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "用于语音交互输入，将你的语音实时转写为文字。"
        NSSpeechRecognitionUsageDescription: "用于将你的语音转写为文字，辅助对话输入。"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ailab.AIPlatformApp
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "4"
        DEVELOPMENT_TEAM: AALA948YY5
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    scheme:
      testTargets:
        - AIPlatformAppTests

  AIPlatformAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - AIPlatformAppTests
    dependencies:
      - target: AIPlatformApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ailab.AIPlatformAppTests
        DEVELOPMENT_TEAM: AALA948YY5
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
